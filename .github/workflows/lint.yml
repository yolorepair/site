name: lint

# Checks that don't need the image: the Dockerfiles themselves, and the HTML and
# internal links of the built site. The image workflow covers the rest (build,
# smoke test, publish).
#
# The job names are what branch protection lists as required checks. Renaming
# one means updating the rule on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint the site's Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Lint the relay's Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: relay/Dockerfile

  html-and-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Node as the Dockerfile's build stage, read from its FROM line so a
      # bump there (Dependabot's, usually) can't leave this one behind.
      - name: Read the Node version from the Dockerfile
        id: node
        run: |
          version="$(grep -oE 'node:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)"
          if [ -z "$version" ]; then
            echo "::error::no node:X.Y.Z tag found in the Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Validate the HTML
        run: npm run check:html

      # Internal links only, served from dist/ on localhost. Anything https://
      # is skipped: an outside site being down shouldn't fail a PR.
      - name: Check internal links
        run: npm run check:links
