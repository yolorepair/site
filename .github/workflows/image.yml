name: image

# Push to main: smoke-test the image, then build multi-arch and push
# :latest and :<sha> to GHCR. Pull requests run the same build and test
# without pushing.
#
# :latest is the tag Flux tracks in cluster-management (digest reflection on a
# mutable tag). :<sha> is there for rollbacks and for pinning by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/yolorepair/site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the runner and load it
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yolorepair-site:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke.sh yolorepair-site:test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch (push on main only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
