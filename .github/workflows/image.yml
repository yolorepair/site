name: image

# Two images, one job each: the site (build) and the relay (relay).
#
# Push to main: smoke-test the image, then build multi-arch and push
# :latest and :<sha> to GHCR. Pull requests run the same build and test
# without pushing.
#
# The job names are what branch protection lists as required checks. Renaming
# one means updating the rule on main.
#
# :latest is the tag Flux tracks in cluster-management (digest reflection on a
# mutable tag). :<sha> is there for rollbacks and for pinning by hand. A
# release adds :X.Y.Z and :X.Y, so a deploy can pin to a version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release-please calls this with the new version after a release. A tag it
  # pushes with the Actions token can't trigger a workflow on its own.
  workflow_call:
    inputs:
      version:
        description: "Release tag, e.g. v0.3.0"
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  # The version keeps a release build from cancelling the latest build that the
  # same push to main starts.
  group: image-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/yolorepair/site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the runner and load it
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: yolorepair-site:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: test/smoke.sh yolorepair-site:test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<sha> and :latest from main; :X.Y.Z and :X.Y for a release.
      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            v="${VERSION#v}"
            echo "tags=$IMAGE:$v,$IMAGE:${v%.*}" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:$v" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$GITHUB_SHA,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build multi-arch (push on main only)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          tags: ${{ steps.tags.outputs.tags }}

      # The deploy target is a Raspberry Pi cluster. If linux/arm64 ever falls
      # out of the platforms list above, this fails the build here rather than
      # letting a pod fail to schedule on the cluster days later.
      - name: Assert published manifest includes linux/arm64
        if: github.event_name != 'pull_request'
        env:
          FIRST: ${{ steps.tags.outputs.first }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$FIRST")
          echo "$manifest"
          if ! grep -q 'linux/arm64' <<<"$manifest"; then
            echo "::error::published manifest does not advertise linux/arm64"
            exit 1
          fi
          echo "✓ linux/arm64 present in published manifest"

  # The relay: the Go service the repair-request form posts to. Same shape as
  # the job above, with the Go checks in front. No QEMU: the Dockerfile
  # cross-compiles on the runner and the final stage runs nothing.
  relay:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/yolorepair/site-relay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same Go as the Dockerfile's build stage, read from its FROM line so a
      # bump there (Dependabot's, usually) can't leave this one behind.
      - name: Read the Go version from the Dockerfile
        id: go
        run: |
          version="$(grep -oE 'golang:[0-9]+\.[0-9]+\.[0-9]+' relay/Dockerfile | head -1 | cut -d: -f2)"
          if [ -z "$version" ]; then
            echo "::error::no golang:X.Y.Z tag found in relay/Dockerfile"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Standard library only: there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting
        working-directory: relay
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: relay
        run: go vet ./...

      - name: Test
        working-directory: relay
        run: go test -race -count=1 ./...

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for the runner and load it
        uses: docker/build-push-action@v7
        with:
          context: relay
          load: true
          tags: yolorepair-site-relay:test
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Smoke test
        run: relay/smoke.sh yolorepair-site-relay:test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<sha> and :latest from main; :X.Y.Z and :X.Y for a release. The
      # version is the repo's: both images carry the same one.
      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            v="${VERSION#v}"
            echo "tags=$IMAGE:$v,$IMAGE:${v%.*}" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:$v" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$GITHUB_SHA,$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "first=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build multi-arch (push on main only)
        uses: docker/build-push-action@v7
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=relay
          tags: ${{ steps.tags.outputs.tags }}

      - name: Assert published manifest includes linux/arm64
        if: github.event_name != 'pull_request'
        env:
          FIRST: ${{ steps.tags.outputs.first }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$FIRST")
          echo "$manifest"
          if ! grep -q 'linux/arm64' <<<"$manifest"; then
            echo "::error::published manifest does not advertise linux/arm64"
            exit 1
          fi
          echo "✓ linux/arm64 present in published manifest"
