# yolorepair.com static site. Plain HTTP on 8080; Cloudflare ends TLS and
# does the HTTPS redirect at the edge, so there's none here.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirects stay relative so they never leak :8080 or the pod hostname.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    # text/html is always compressed; PNGs are already compressed.
    gzip_types text/css text/plain application/javascript application/json application/manifest+json application/xml image/svg+xml;

    error_page 404 /404.html;

    # HTML: always revalidate, so a new image shows up on the next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Astro's build output: stylesheets and fonts with a content hash in the
    # filename, so a changed file is a new URL and these never go stale.
    # ^~ keeps the regex block below from taking these requests.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Files from public/. Filenames aren't content-hashed, so a day, not "immutable".
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|css|js|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The repair-request form posts to /request/submit. That location is
    # written at start by /docker-entrypoint.d/40-relay-location.sh, because
    # it depends on RELAY_URL: proxied to the relay when that's set, a
    # redirect to /request/problem/ when it isn't.
    include /tmp/relay-location.conf;

    # Probe target that doesn't depend on site content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
