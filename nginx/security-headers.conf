# Included from every location that sets its own add_header. nginx drops
# inherited add_header lines the moment a block declares one, so these can't
# live at server level alone.
#
# No HSTS here: TLS ends at Cloudflare, so HSTS belongs at the edge.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The page uses an inline <style> block and Google Fonts. Tighten style-src and
# drop the font hosts if the CSS moves to a file and the fonts get self-hosted.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
