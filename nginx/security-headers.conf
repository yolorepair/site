# Included from every location that sets its own add_header. nginx drops
# inherited add_header lines the moment a block declares one, so these can't
# live at server level alone.
#
# No HSTS here: TLS ends at Cloudflare, so HSTS belongs at the edge.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Everything the page loads comes from this origin: stylesheets are files under
# /_astro/ and the fonts ship in the image. No third-party hosts and no
# 'unsafe-inline', so an inline <style> block or style="" attribute won't apply.
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
